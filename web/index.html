<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RustJava</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --chassis: #1a1520;
      --chassis-edge: #2c2436;
      --key: #2e2738;
      --key-edge: #4a4158;
      --lcd-bg: #1c2a18;
      --lcd-ink: #c8e8a0;
      --amber: #e6a84a;
      --error: #e07050;
      --paper: #efe6d6;
      color-scheme: dark;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: #0c0a10;
      color: var(--paper);
      touch-action: none;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(1200px 600px at 50% -10%, #2a2038 0%, transparent 55%),
        #0c0a10;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    }

    .https-banner {
      display: none;
      margin: 0 auto 8px;
      width: min(100%, 420px);
      padding: 8px 12px;
      border: 1px solid #7a4a16;
      border-radius: 8px;
      background: #2a1c0c;
      color: var(--amber);
      font-size: 13px;
      line-height: 1.4;
    }

    .https-banner.visible {
      display: block;
    }

    .phone {
      width: min(100%, 420px);
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
      gap: 8px;
      padding: 14px 14px 12px;
      border-radius: 28px;
      background:
        linear-gradient(180deg, #241c2e 0%, var(--chassis) 18%, #120e18 100%);
      border: 1px solid var(--chassis-edge);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .earpiece {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 18px;
    }

    .slit {
      width: 72px;
      height: 6px;
      border-radius: 99px;
      background: #0a080e;
      box-shadow: inset 0 1px 2px #000;
    }

    .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3a2a12;
      box-shadow: inset 0 0 0 1px #000;
    }

    .led.on {
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
    }

    .brand {
      text-align: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #9a8f7a;
    }

    .lcd {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      background: var(--lcd-bg);
      border: 3px solid #0d120c;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.45);
    }

    canvas {
      width: min(100%, calc((100dvh - 320px) * 0.75));
      max-height: 100%;
      aspect-ratio: 3 / 4;
      image-rendering: pixelated;
      background: #000;
      display: block;
    }

    .empty-hint,
    .error-panel {
      position: absolute;
      inset: 10px;
      display: none;
      padding: 12px;
      pointer-events: none;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      color: var(--lcd-ink);
      white-space: pre-wrap;
      overflow: auto;
    }

    .empty-hint.visible {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .error-panel.visible {
      display: block;
      color: var(--error);
      background: rgba(12, 8, 8, 0.88);
      pointer-events: auto;
    }

    .meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
    }

    .status {
      min-width: 0;
      color: var(--lcd-ink);
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .fps {
      color: var(--amber);
      font-variant-numeric: tabular-nums;
    }

    .file-row label {
      display: block;
      font-size: 12px;
      color: #cbbfa8;
      margin-bottom: 4px;
    }

    input[type="file"] {
      width: 100%;
      min-width: 0;
      color: var(--paper);
      background: #141018;
      border: 1px solid var(--key-edge);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
    }

    .controls {
      display: grid;
      gap: 8px;
    }

    .soft-row,
    .main-row,
    .num-row {
      display: grid;
      gap: 8px;
    }

    .soft-row {
      grid-template-columns: 1fr 1fr;
    }

    .main-row {
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 44px);
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .num-row {
      grid-template-columns: repeat(5, 1fr);
    }

    button {
      min-width: 0;
      min-height: 44px;
      border: 1px solid var(--key-edge);
      border-radius: 10px;
      background: linear-gradient(180deg, #3a3248, var(--key));
      color: var(--paper);
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      touch-action: none;
      appearance: none;
    }

    button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    button:active,
    button.active {
      background: #4a3f28;
      border-color: var(--amber);
      color: #fff6e4;
    }

    .empty {
      visibility: hidden;
    }

    .log-wrap {
      border: 1px solid #3a3344;
      border-radius: 8px;
      background: #100c14;
      color: #c9c0b3;
    }

    .log-wrap > summary {
      cursor: pointer;
      padding: 8px 10px;
      font-size: 12px;
      color: #9a8f7a;
    }

    .log {
      height: 104px;
      margin: 0;
      padding: 8px 10px 10px;
      overflow: auto;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="https-banner" class="https-banner">
    This page is not a secure context. 3D/WebGPU stays off — serve it over HTTPS (see tools/create_https_cert.ps1).
  </div>
  <main class="phone">
    <div class="earpiece">
      <span class="slit" aria-hidden="true"></span>
      <span id="led" class="led" aria-hidden="true"></span>
    </div>
    <div class="brand">RustJava</div>

    <div class="lcd">
      <canvas id="screen" width="240" height="320" aria-label="Phone screen"></canvas>
      <div id="empty-hint" class="empty-hint visible">Choose a JAR to run a MIDlet.</div>
      <div id="error-panel" class="error-panel" role="alert"></div>
    </div>

    <div class="meta">
      <div id="status" class="status">Ready</div>
      <div id="fps" class="fps">0 fps</div>
    </div>

    <div class="file-row">
      <label for="jar">Game JAR</label>
      <input id="jar" type="file" accept=".jar,application/java-archive">
    </div>

    <div class="controls" id="controls">
      <div class="soft-row">
        <button type="button" data-role="softLeft" data-key="-6" aria-label="Left soft key">L</button>
        <button type="button" data-role="softRight" data-key="-7" aria-label="Right soft key">R</button>
      </div>
      <div class="main-row">
        <div class="dpad">
          <button class="empty" tabindex="-1" aria-hidden="true"></button>
          <button type="button" data-role="up" data-key="-1" aria-label="Up">&uarr;</button>
          <button class="empty" tabindex="-1" aria-hidden="true"></button>
          <button type="button" data-role="left" data-key="-3" aria-label="Left">&larr;</button>
          <button type="button" data-role="fire" data-key="-5" aria-label="OK">OK</button>
          <button type="button" data-role="right" data-key="-4" aria-label="Right">&rarr;</button>
          <button class="empty" tabindex="-1" aria-hidden="true"></button>
          <button type="button" data-role="down" data-key="-2" aria-label="Down">&darr;</button>
          <button class="empty" tabindex="-1" aria-hidden="true"></button>
        </div>
        <div class="actions">
          <button type="button" data-key="49" aria-label="Key 1">1</button>
          <button type="button" data-key="51" aria-label="Key 3">3</button>
          <button type="button" data-key="55" aria-label="Key 7">7</button>
          <button type="button" data-key="57" aria-label="Key 9">9</button>
        </div>
      </div>
      <div class="num-row">
        <button type="button" data-key="48" aria-label="Key 0">0</button>
        <button type="button" data-key="50" aria-label="Key 2">2</button>
        <button type="button" data-key="52" aria-label="Key 4">4</button>
        <button type="button" data-key="54" aria-label="Key 6">6</button>
        <button type="button" data-key="56" aria-label="Key 8">8</button>
      </div>
    </div>

    <details id="log-wrap" class="log-wrap">
      <summary>Log</summary>
      <pre id="log" class="log"></pre>
    </details>
  </main>

  <script type="module" src="./app.js?v=20260902-221345"></script>
</body>
</html>
