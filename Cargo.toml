[workspace]
resolver = "3"
members = [
    "classfile",
    "java_class_proto",
    "java_constants",
    "java_runtime",
    "jvm",
    "jvm_rust",
    "test_utils",
]
default-members = ["."]

[profile.release]
codegen-units = 1
lto = "thin"

[profile.dev]
opt-level = 1

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = { version = "1.0.102", default-features = false }
async-recursion = { version = "1.1.1", default-features = false }
async-trait = { version = "0.1.89", default-features = false }
bitflags = { version = "2.13.0", default-features = false }
bytemuck = { version = "1.25.0", default-features = false, features = ["extern_crate_alloc"] }
chrono = { version = "0.4.45", default-features = false }
console_error_panic_hook = { version = "0.1.7", default-features = false }
dyn-clone = { version = "1.0.20", default-features = false }
dyn-hash = { version = "1.0.0", default-features = false }
encoding_rs = { version = "0.8.35", features = ["alloc"], default-features = false }
event-listener = { version = "5.4.1", default-features = false }
hashbrown = { version = "0.17.1", features = ["default-hasher"], default-features = false }
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
nom = { version = "8.0.0", default-features = false, features = ["alloc"] }
parking_lot = { version = "0.12.5", default-features = false }
png = "0.18.1"
pollster = "0.4.0"
js-sys = { version = "0.3.102", default-features = false }
tokio = { version = "1.52.3", features = ["macros"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", default-features = false }
wasm-bindgen = { version = "0.2.125", default-features = false }
wasm-bindgen-futures = { version = "0.4.75", default-features = false }
web-sys = { version = "0.3.102", default-features = false }
wgpu = "29.0.3"
winit = "0.30.13"
zip = { version = "9.0.0-pre2", default-features = false, features = ["deflate"] }

classfile = { path = "classfile" }
java_class_proto = { path = "java_class_proto" }
java_constants = { path = "java_constants" }
java_runtime = { path = "java_runtime" }
jvm = { path = "jvm" }
jvm_rust = { path = "jvm_rust" }
test_utils = { path = "test_utils" }

[package]
name = "rust_java"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["desktop-window"]
desktop-window = ["dep:pollster", "dep:wgpu", "dep:winit"]
browser-window = [
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:wgpu",
    "wgpu/webgl",
]

[[bin]]
name = "rust_java"
required-features = ["desktop-window"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = { workspace = true }

anyhow = { workspace = true }
bytemuck = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
png = { workspace = true }
pollster = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
zip = { workspace = true }

jvm = { workspace = true }
jvm_rust = { workspace = true }
java_class_proto = { workspace = true }
java_runtime = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
workspace = true
optional = true
features = [
    "CanvasRenderingContext2d",
    "console",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "Performance",
    "PointerEvent",
    "Window",
]

[dev-dependencies]
test_utils = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
workspace = true
features = ["rt-multi-thread", "time"]

[target.'cfg(target_arch = "wasm32")'.dependencies.tokio]
workspace = true
features = ["rt", "time"]
